# The app itself, shared by nginx.conf (HTTP only) and nginx-https.conf.
# Both include it from /home/ubuntu/campus-connect/deploy/nginx-app.conf.
#
#   /api/..., /admin/...  -> Django (Daphne on 127.0.0.1:8000)
#   /ws/...               -> Django Channels WebSockets (same Daphne)
#   /static/...           -> Django admin/DRF CSS+JS (collectstatic output)
#   /media/...            -> uploaded profile photos (backend/media)
#   everything else       -> the built React app (frontend/dist)

# Profile photos can be up to 10 MB (Django checks the exact limit too).
# Bigger requests get a 413 from Nginx before reaching Django.
client_max_body_size 10M;

root /home/ubuntu/campus-connect/frontend/dist;
index index.html;

location /static/ {
    alias /home/ubuntu/campus-connect/backend/staticfiles/;
    expires 7d;
}

# Profile photos, saved by Django into MEDIA_ROOT (backend/media). Every
# file gets a new random name and is never changed afterwards, so browsers
# can keep it for 30 days. ^~ = don't let the regex locations below match.
location ^~ /media/ {
    alias /home/ubuntu/campus-connect/backend/media/;
    expires 30d;
    access_log off;
    # Only ever serve existing files: no directory listings, no index.html.
    autoindex off;
    try_files $uri =404;
}

location ~ ^/(api|admin)/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Chat WebSockets. A WebSocket starts as an HTTP request asking to
# "upgrade"; these lines pass that request on (HTTP/1.1 + Upgrade and
# Connection headers) instead of treating it as a normal page load.
location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep idle chats open for up to an hour (default is 60 seconds).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # The URL carries the login token (?token=...): keep it out of logs.
    access_log off;
}

# React Router handles paths like /home or /verify/<uid>/<token>:
# serve the file if it exists, otherwise index.html.
location / {
    try_files $uri /index.html;
}
