# Nginx site for the EC2 server with HTTPS on datewithincampus.com.
# deploy.sh uses this file instead of nginx.conf once the Let's Encrypt
# certificate exists (see docs/deploy.md, "Domain + HTTPS").

# Port 80: answer Let's Encrypt renewal checks, send everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://datewithincampus.com$request_uri;
    }
}

# Port 443: the real site. Nginx handles the encryption and talks plain HTTP
# to Daphne on the same machine; X-Forwarded-Proto tells Django it was HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name datewithincampus.com www.datewithincampus.com;

    ssl_certificate     /etc/letsencrypt/live/datewithincampus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datewithincampus.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Browsers remember to use HTTPS for this site for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /home/ubuntu/campus-connect/deploy/nginx-app.conf;
}
