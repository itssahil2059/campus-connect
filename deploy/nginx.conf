# Nginx site config for the EC2 server.
# Installed by setup-server.sh to /etc/nginx/sites-available/gittogether.
#
# One address serves everything:
#   /api/..., /admin/...  -> Django (gunicorn on 127.0.0.1:8000)
#   /static/...           -> Django admin/DRF CSS+JS (collectstatic output)
#   everything else       -> the built React app (frontend/dist)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Room for profile photo uploads later.
    client_max_body_size 10M;

    root /home/ubuntu/campus-connect/frontend/dist;
    index index.html;

    location /static/ {
        alias /home/ubuntu/campus-connect/backend/staticfiles/;
        expires 7d;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router handles paths like /home or /verify/<uid>/<token>:
    # serve the file if it exists, otherwise index.html.
    location / {
        try_files $uri /index.html;
    }
}
