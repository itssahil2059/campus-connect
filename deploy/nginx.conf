# Nginx site for the EC2 server, HTTP only (used until the HTTPS certificate
# exists; deploy.sh then switches to nginx-https.conf automatically).
# Installed to /etc/nginx/sites-available/gittogether.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt proves we own the domain by fetching a file from here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /home/ubuntu/campus-connect/deploy/nginx-app.conf;
}
